    <main>
        <section class="login">
            <h2>Controle de Acesso</h2>
            <form novalidate method="get">
                <fieldset>
                    <legend>LOGIN</legend>
                    <div>
                        <label for="e-mail">E-mail</label><input type="email" name="e-mail" id="e-mail" 
                        placeholder="Digite seu email" required="required">
                    </div>
                    <div>
                        <label for="senha">Senha</label><input type="password" name="senha" id="senha" 
                        placeholder="Digite sua senha" required>
                    </div>
                    <div>
                        <button type="submit" id="btnLogin">LOGIN</button>
                    </div>                                           
                </fieldset>
            </form>
        </section>
    </main>
